name: Link check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/link-check.yml'
      - 'scripts/sync-link-issue.cjs'
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  lychee:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 30
            --max-retries 2
            --accept 200,202,204,206,301,302,403,405,429
            --exclude '^https://www\.seroundtable\.com/$'
            README.md CONTRIBUTING.md
          lycheeVersion: v0.24.2
          fail: true
          format: markdown

      - name: Update the maintenance issue
        if: always() && steps.lychee.outputs.exit_code != ''
        uses: actions/github-script@v7
        env:
          LINK_CHECK_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        with:
          script: |
            const fs = require('node:fs');
            const sync = require('./scripts/sync-link-issue.cjs');
            const reportPath = './lychee/out.md';
            if (!fs.existsSync(reportPath)) {
              core.setFailed('Link check produced no report; existing issues were left unchanged.');
              return;
            }
            await sync({
              github,
              repo: context.repo,
              exitCode: process.env.LINK_CHECK_EXIT_CODE,
              report: fs.readFileSync(reportPath, 'utf8'),
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
